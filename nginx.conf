# Production nginx config. The Dockerfile copies it to /etc/nginx/templates/, so at container
# start the nginx image fills in the BACKEND_URL and NGINX_LOCAL_RESOLVERS environment variables
# (envsubst). nginx's own variables ($uri, $host …) are left untouched.
# Keep dollar-brace placeholders out of comments: envsubst fills those in too, and a value with a
# newline in it turns the rest of the comment into config lines ("unknown directive").
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Inherited by every location below, because none sets an add_header of its own (`expires`
  # doesn't count). Adding one to a location would silently drop all three there.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # The container's DNS server (Railway's internal DNS). proxy_pass below uses a variable, so
  # nginx looks up the backend's private hostname per request instead of once at startup — the
  # backend gets a new private IP on every redeploy, and a cached one would break every /api call.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

  # The API, over Railway's private network. The browser only ever talks to this origin, so
  # there's no CORS and the refresh cookie stays first-party. The URI (/api/...) passes unchanged.
  #
  # BACKEND_URL must be the backend's PRIVATE address: plain http, the backend's port, no path.
  #   http://<backend service's RAILWAY_PRIVATE_DOMAIN>:5000
  # A public *.up.railway.app URL (this frontend's above all) sends each call back out through
  # Railway's edge and into this same nginx again: a loop the edge ends with a 502.
  location /api/ {
    # Bodies nginx writes itself (the two errors below) are JSON in the API's error shape, so the
    # app shows a real message. Proxied responses keep the backend's own Content-Type.
    default_type application/json;

    # Loop guard: every request forwarded from here carries X-Frontend-Proxy, so one that arrives
    # with it has come back to us, meaning BACKEND_URL points at this frontend. Fail on the first
    # hop with a clear message instead of looping.
    if ($http_x_frontend_proxy) {
      return 508 '{"error":{"code":"PROXY_LOOP","message":"BACKEND_URL points back at the frontend. Set it to the backend private address."}}';
    }

    set $backend ${BACKEND_URL};
    # With a variable in proxy_pass, a trailing slash would replace every path with "/".
    if ($backend ~ ^(.+?)/+$) {
      set $backend $1;
    }
    proxy_pass $backend;

    proxy_http_version 1.1;
    # No `Host $host`: nginx sends the backend's own host name (its default). Sending this site's
    # name to a public URL is exactly what routes the request back here.
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Frontend-Proxy 1;
    # SNI, should BACKEND_URL ever be https (without it the TLS handshake fails, which is a 502).
    proxy_ssl_server_name on;

    # Room for the API's response headers (helmet's set plus Set-Cookie on login / refresh /
    # logout). Overflowing the 4k default is a 502 "upstream sent too big header".
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # A wrong host or port fails within seconds, not after nginx's 60 s default.
    proxy_connect_timeout 5s;
    # nginx's own 502 / 504 (backend down or unreachable) answered in the API's error shape.
    error_page 502 504 = @backend_unavailable;

    # helmet on the API sends these too; hide its copies so each response has one value.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
  }

  location @backend_unavailable {
    default_type application/json;
    return 502 '{"error":{"code":"BACKEND_UNAVAILABLE","message":"The API is not reachable right now. Please try again shortly."}}';
  }

  # Vite's content-hashed bundles: a deploy changes their names, so a file never changes in place.
  # A missing one is a real 404, not index.html served as JavaScript.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  # The single-page app. `no-cache` makes browsers revalidate index.html on every load, so nobody
  # keeps an old one pointing at bundles a new deploy removed.
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }
}
