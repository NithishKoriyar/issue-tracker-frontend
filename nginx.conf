# Production nginx config. The Dockerfile copies it to /etc/nginx/templates/, so at container
# start the nginx image fills in ${BACKEND_URL} and ${NGINX_LOCAL_RESOLVERS} from environment
# variables (envsubst). nginx's own variables ($uri, $host …) are left untouched.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Inherited by every location below, because none sets an add_header of its own (`expires`
  # doesn't count). Adding one to a location would silently drop all three there.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # The container's DNS server (Railway's internal DNS). proxy_pass below uses a variable, so
  # nginx looks up the backend's private hostname per request instead of once at startup — the
  # backend gets a new private IP on every redeploy, and a cached one would break every /api call.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

  # The API, over Railway's private network. The browser only ever talks to this origin, so
  # there's no CORS and the refresh cookie stays first-party. The URI (/api/...) passes unchanged.
  location /api/ {
    set $backend ${BACKEND_URL};
    proxy_pass $backend;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # helmet on the API sends these too; hide its copies so each response has one value.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
  }

  # Vite's content-hashed bundles: a deploy changes their names, so a file never changes in place.
  # A missing one is a real 404, not index.html served as JavaScript.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  # The single-page app. `no-cache` makes browsers revalidate index.html on every load, so nobody
  # keeps an old one pointing at bundles a new deploy removed.
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }
}
